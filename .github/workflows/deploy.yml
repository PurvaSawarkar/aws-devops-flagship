```yaml
name: Deploy TaskForge to EC2

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            console.log('OIDC audience:', payload.aud);
            console.log('OIDC subject:', payload.sub);

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy through AWS Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0e82634cc12f748d7" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy TaskForge from GitHub Actions" \
            --parameters 'commands=["set -e","sudo -u ubuntu bash -lc '\''cd /home/ubuntu/aws-devops-flagship && git pull --ff-only origin master && sudo docker compose up -d --build && curl --fail --silent --show-error http://localhost:8000/health'\''"]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command submitted: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0e82634cc12f748d7" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                echo "TaskForge deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deployment failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "i-0e82634cc12f748d7" \
                  --query 'StandardErrorContent' \
                  --output text
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for the SSM command."
          exit 1
```
